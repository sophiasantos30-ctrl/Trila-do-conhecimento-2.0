<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perguntados - O Jogo de Tabuleiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0f8ff;
            user-select: none;
        }

        h1, h2, h3, .title-font {
            font-family: 'Fredoka One', cursive;
        }

        /* Cores das Categorias */
        .cat-geografia { background-color: #3b82f6; color: white; } /* Azul */
        .cat-ciencia { background-color: #22c55e; color: white; } /* Verde */
        .cat-historia { background-color: #eab308; color: black; } /* Amarelo */
        .cat-esportes { background-color: #f97316; color: white; } /* Laranja */
        .cat-arte { background-color: #d946ef; color: white; } /* Magenta */
        .cat-entretenimento { background-color: #ef4444; color: white; } /* Vermelho */

        /* Cores dos Peões */
        .peao-azul { background-color: #2563eb; }
        .peao-verde { background-color: #16a34a; }
        .peao-vermelho { background-color: #dc2626; }
        .peao-amarelo { background-color: #facc15; }
        .peao-laranja { background-color: #ea580c; }
        .peao-roxo { background-color: #9333ea; }
        .peao-rosa { background-color: #db2777; }
        .peao-branco { background-color: #ffffff; border: 1px solid #ccc; }
        .peao-cinza { background-color: #6b7280; }
        .peao-preto { background-color: #000000; }

        .board-space {
            transition: transform 0.2s;
        }
        .board-space:hover {
            transform: scale(1.05);
        }

        .dice-anim {
            animation: roll 0.5s infinite linear;
        }

        @keyframes roll {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="h-screen w-full overflow-hidden flex flex-col items-center justify-center relative">

    <div id="app" class="w-full h-full max-w-6xl mx-auto flex flex-col relative shadow-2xl bg-white/50 backdrop-blur-sm sm:rounded-2xl sm:h-[95vh] sm:my-auto overflow-hidden">
        
        <!-- Header -->
        <header class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md z-10">
            <div class="flex items-center gap-2">
                <i class="fas fa-dice text-2xl"></i>
                <h1 class="text-2xl title-font tracking-wider">Perguntados Board</h1>
            </div>
            <div id="header-status" class="text-sm font-bold bg-white/20 px-3 py-1 rounded-full">
                Menu Principal
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto relative bg-slate-50">
            <!-- Views serão injetadas aqui via JS -->
        </main>

    </div>

    <!-- Modals Containers -->
    <div id="modal-container" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <!-- Modals serão injetados aqui -->
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">

        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Variáveis Globais de Ambiente e Estado
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'perguntados-board';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        
        let app, db, auth;
        let unsubscribeRoom = null;

            { id: 'esportes', name: 'Esportes', colorClass: 'cat-esportes', icon: 'fa-futbol' },

            { id: 'azul', class: 'peao-azul', name: 'Azul' },
            { id: 'verde', class: 'peao-verde', name: 'Verde' },
            { id: 'vermelho', class: 'peao-vermelho', name: 'Vermelho' },
            { id: 'amarelo', class: 'peao-amarelo', name: 'Amarelo' },
            { id: 'laranja', class: 'peao-laranja', name: 'Laranja' },

                { q: "Quem esculpiu a famosa obra 'O Pensador'?", options: ["Aleijadinho", "Donatello", "Auguste Rodin", "Michelangelo"], a: 2 },
                { q: "Quem é o autor do 'Sítio do Picapau Amarelo'?", options: ["Ziraldo", "Monteiro Lobato", "Mauricio de Sousa", "Machado de Assis"], a: 1 },
                { q: "Na mitologia romana, quem é a deusa do amor e da beleza?", options: ["Atena", "Hera", "Afrodite", "Vênus"], a: 3 },
                { q: "A famosa obra 'Abaporu' foi pintada por qual artista brasileira?", options: ["Anita Malfatti", "Tarsila do Amaral", "Frida Kahlo", "Tomie Ohtake"], a: 1 },
                { q: "Quem é o criador das histórias em quadrinhos da Turma da Mônica?", options: ["Ziraldo", "Quino", "Stan Lee", "Mauricio de Sousa"], a: 3 }
            ],
            entretenimento: [
                { q: "Qual é o nome do bruxo com uma cicatriz em forma de raio?", options: ["Percy Jackson", "Harry Potter", "Frodo Bolseiro", "Luke Skywalker"], a: 1 },
                { q: "Em 'De Volta para o Futuro', qual é o carro máquina do tempo?", options: ["Mustang", "DeLorean", "Ferrari", "Fusca"], a: 1 },
                { q: "Quem canta a música 'Thriller'?", options: ["Prince", "David Bowie", "Michael Jackson", "Elton John"], a: 2 },
                { q: "Quem é o principal criador do personagem Mickey Mouse?", options: ["Stan Lee", "Walt Disney", "Matt Groening", "Jim Henson"], a: 1 },
                { q: "Qual é o nome do famoso vilão da saga Star Wars?", options: ["Lord Voldemort", "Coringa", "Darth Vader", "Thanos"], a: 2 },
                { q: "Qual super-herói bilionário usa um traje inspirado em um morcego?", options: ["Homem de Ferro", "Superman", "Homem-Aranha", "Batman"], a: 3 },
                { q: "Qual é o jogo de videogame mais vendido de todos os tempos, focado em blocos?", options: ["Tetris", "Super Mario", "Minecraft", "GTA V"], a: 2 },
                { q: "Qual filme quebrou recordes de bilheteria com criaturas azuis chamadas Na'vi?", options: ["Smurfs", "Avatar", "Star Wars", "Vingadores"], a: 1 }
            ]
        };

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-red-500' : (type === 'success' ? 'bg-green-500' : 'bg-blue-500');
            toast.className = `${bg} text-white px-4 py-2 rounded shadow-lg transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2`;
            toast.innerHTML = `<i class="fas fa-${type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i> ${message}`;
            
            container.appendChild(toast);
            
            // Animate in
            setTimeout(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            }, 10);

            // Remove after 3s
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function generateId() {
            return Math.random().toString(36).substring(2, 9);
        }

        function generateRoomCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        async function initApp() {
            if (firebaseConfig) {
                try {
                    app = initializeApp(firebaseConfig);
                    db = getFirestore(app);
                    auth = getAuth(app);

                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    STATE.user.id = auth.currentUser.uid;
                } catch (e) {
                    console.error("Firebase init erro:", e);
                    showToast("Erro ao conectar ao servidor. Modo offline recomendado.", "error");
                }
            } else {
                STATE.user.id = generateId(); // Fallback ID se não houver config
            }
            
            render();
        }

        async function getRoomRef(roomId) {
            if (!db) return null;
            return doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomId);
        }

        async function createRoomAction(size, maxPlayers) {
            const roomId = generateRoomCode();
            const roomData = {
                id: roomId,
                status: 'lobby',
                hostId: STATE.user.id,
                boardSize: parseInt(size),
                maxPlayers: parseInt(maxPlayers),
                players: [{
                    id: STATE.user.id,
                    name: STATE.user.name,
                    color: null,
                    position: 0,
                    score: 0,
                    isReady: false
                }],
                turnIndex: 0,
                currentAction: 'waiting', 
                diceValue: null,
                currentQuestion: null,
                winnerId: null,
                // Armazena os índices das perguntas já feitas em cada categoria
                usedQuestions: {
                    geografia: [], ciencia: [], historia: [], esportes: [], arte: [], entretenimento: []
                },
                updatedAt: new Date().toISOString()
            };

            if (STATE.mode === 'online' && db) {
                try {
                    await setDoc(await getRoomRef(roomId), roomData);
                    joinRoomAction(roomId);
                } catch (e) {
                    showToast("Erro ao criar sala", "error");
                    console.error(e);
                }
            } else {
                STATE.room = roomData;
                STATE.view = 'lobby';
                render();
            }
        }

        async function joinRoomAction(roomId) {
            roomId = roomId.toUpperCase();
            if (STATE.mode === 'online' && db) {
                const ref = await getRoomRef(roomId);
                const snap = await getDoc(ref);
                if (!snap.exists()) {
                    showToast("Sala não encontrada!", "error");
                    return;
                }
                const room = snap.data();
                if (room.status !== 'lobby') {
                    showToast("O jogo já começou nesta sala!", "error");
                    return;
                }
                if (room.players.length >= room.maxPlayers && !room.players.find(p => p.id === STATE.user.id)) {
                    showToast("Sala cheia!", "error");
                    return;
                }

                // Garante que a estrutura de histórico de perguntas existe
                if (!room.usedQuestions) {
                    room.usedQuestions = { geografia: [], ciencia: [], historia: [], esportes: [], arte: [], entretenimento: [] };
                }

                // Adiciona jogador se não estiver
                if (!room.players.find(p => p.id === STATE.user.id)) {
                    room.players.push({
                        id: STATE.user.id,
                        name: STATE.user.name,
                        color: null,
                        position: 0,
                        score: 0,
                        isReady: false
                    });
                    await updateDoc(ref, { players: room.players });
                }

                STATE.room = room;
                STATE.view = 'lobby';
                
                // Configura Listener
                if (unsubscribeRoom) unsubscribeRoom();
                unsubscribeRoom = onSnapshot(ref, (doc) => {
                    if (doc.exists()) {
                        const updatedRoom = doc.data();
                        handleRoomUpdate(updatedRoom);
                    } else {
                        showToast("A sala foi fechada.", "error");
                        leaveRoomAction();
                    }
                });
                render();
            }
        }

        function handleRoomUpdate(updatedRoom) {
            if (updatedRoom.status !== 'finished') {
                const hostExists = updatedRoom.players.some(p => p.id === updatedRoom.hostId);
                if (!hostExists && updatedRoom.players.length > 0) {
                    if (updatedRoom.players[0].id === STATE.user.id) {
                        updateRoomState({ hostId: STATE.user.id });
                        showToast("Você agora é o líder da sala!", "info");
                    }
                }
            }

            STATE.room = updatedRoom;
            
            if (STATE.room.status === 'playing' && STATE.view === 'lobby') STATE.view = 'game';
            if (STATE.room.status === 'finished' && STATE.view !== 'game_over') STATE.view = 'game_over';
            
            render();
        }

        async function updateRoomState(updates) {
            updates.updatedAt = new Date().toISOString();
            if (STATE.mode === 'online' && db) {
                const ref = await getRoomRef(STATE.room.id);
                try {
                    await updateDoc(ref, updates);
                } catch(e) { console.error("Error updating", e); }
            } else {
                STATE.room = { ...STATE.room, ...updates };
                handleRoomUpdate(STATE.room);
            }
        }

        async function leaveRoomAction() {
            if (STATE.room && STATE.mode === 'online' && db) {
                if (unsubscribeRoom) {
                    unsubscribeRoom();
                    unsubscribeRoom = null;
                }
                const ref = await getRoomRef(STATE.room.id);
                const snap = await getDoc(ref);
                if (snap.exists()) {
                    let room = snap.data();
                    room.players = room.players.filter(p => p.id !== STATE.user.id);
                    if (room.players.length === 0) {
                        await deleteDoc(ref);
                    } else {
                        await updateDoc(ref, { players: room.players });
                    }
                }
            }
            STATE.room = null;
            STATE.view = STATE.mode === 'online' ? 'online_menu' : 'menu';
            render();
        }

        async function rollDice() {
            if (STATE.room.players[STATE.room.turnIndex].id !== STATE.user.id && STATE.mode === 'online') return;
            
            updateRoomState({ currentAction: 'rolling' });
            
            // Simula animação
            setTimeout(async () => {
                const diceValue = Math.floor(Math.random() * 6) + 1;
                
                // Determina categoria do destino alvo
                const currentPlayer = STATE.room.players[STATE.room.turnIndex];
                const targetPos = Math.min(currentPlayer.position + diceValue, STATE.room.boardSize);
                
                const categoryIndex = (targetPos - 1) % CATEGORIES.length;
                const targetCategory = targetPos === 0 ? CATEGORIES[0] : CATEGORIES[categoryIndex];
                
                // Lógica para obter pergunta única não repetida
                const categoryId = targetCategory.id;
                let usedQuestionsForCat = (STATE.room.usedQuestions && STATE.room.usedQuestions[categoryId]) ? [...STATE.room.usedQuestions[categoryId]] : [];
                const catQuestions = QUESTIONS[categoryId];
                
                // Filtra os índices que ainda não foram usados
                let availableIndices = catQuestions.map((_, i) => i).filter(i => !usedQuestionsForCat.includes(i));
                
                // Se esgotou todas as perguntas dessa categoria, recomeça zerando a lista de usadas
                if (availableIndices.length === 0) {
                    usedQuestionsForCat = [];
                    availableIndices = catQuestions.map((_, i) => i);
                }

                // Puxa uma pergunta aleatória dentre as disponíveis
                const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
                const questionData = catQuestions[randomIndex];
                
                // Registra que a pergunta foi usada
                usedQuestionsForCat.push(randomIndex);
                const newUsedQuestionsState = {
                    ...(STATE.room.usedQuestions || { geografia: [], ciencia: [], historia: [], esportes: [], arte: [], entretenimento: [] }),
                    [categoryId]: usedQuestionsForCat
                };

                await updateRoomState({
                    diceValue: diceValue,
                    currentAction: 'answering',
                    currentQuestion: {
                        category: targetCategory,
                        data: questionData,
                        startTime: Date.now()
                    },
                    usedQuestions: newUsedQuestionsState
                });
                
                if(STATE.mode === 'offline') startOfflineTimer();

            }, 1000); // 1s de animação de dado
        }

        function startOfflineTimer() {
            if(STATE.timer) clearInterval(STATE.timer);
            STATE.timeLeft = 60;
            STATE.timer = setInterval(() => {
                STATE.timeLeft--;
                renderQuestionModal();
                if(STATE.timeLeft <= 0) {
                    clearInterval(STATE.timer);
                    handleAnswer(-1); // Errou por tempo
                }
            }, 1000);
        }

        async function handleAnswer(selectedOptionIndex) {
            if(STATE.timer) clearInterval(STATE.timer);
            
            const qData = STATE.room.currentQuestion.data;
            const isCorrect = selectedOptionIndex === qData.a;
            
            let updates = { currentAction: 'moving' };
            const players = [...STATE.room.players];
            const pIndex = STATE.room.turnIndex;

            if (isCorrect) {
                players[pIndex].position = Math.min(players[pIndex].position + STATE.room.diceValue, STATE.room.boardSize);
                players[pIndex].score += 10;
                showToast("Resposta Correta! Andou " + STATE.room.diceValue + " casas.", "success");
            } else {
                if(selectedOptionIndex === -1) showToast("Tempo esgotado! Não andou.", "error");
                else showToast("Resposta Errada! Não andou.", "error");
            }

            // Checa vitória
            if (players[pIndex].position >= STATE.room.boardSize) {
                updates.status = 'finished';
                updates.winnerId = players[pIndex].id;
            } else {
                updates.turnIndex = (pIndex + 1) % players.length;
            }

            updates.players = players;
            updates.currentQuestion = null;
            updates.diceValue = null;

            STATE.room.lastAnswerCorrect = isCorrect;
            render(); 

            setTimeout(async () => {
                updates.currentAction = 'waiting';
                STATE.room.lastAnswerCorrect = null;
                await updateRoomState(updates);
            }, 2500);
        }

        function setView(view) {
            STATE.view = view;
            render();
        }

        function updateHeader() {
            const statusLabel = document.getElementById('header-status');
            let text = 'Menu Principal';
            if (STATE.view === 'online_menu') text = 'Modo Online';
            if (STATE.view === 'create_room') text = 'Criar Sala';
            if (STATE.view === 'join_room') text = 'Entrar em Sala';
            if (STATE.view === 'lobby') text = `Lobby: ${STATE.room?.id || ''}`;
            if (STATE.view === 'game') text = `Jogando`;
            if (STATE.view === 'game_over') text = `Fim de Jogo`;
            statusLabel.innerText = text;
        }

        function render() {
            updateHeader();
            const main = document.getElementById('main-content');
            main.innerHTML = '';
            const modal = document.getElementById('modal-container');
            modal.innerHTML = '';
            modal.classList.add('hidden');

            switch (STATE.view) {
                case 'menu':
                    main.innerHTML = renderMainMenu();
                    break;
                case 'online_menu':
                    main.innerHTML = renderOnlineMenu();
                    break;
                case 'create_room':
                    main.innerHTML = renderCreateRoom();
                    break;
                case 'join_room':
                    main.innerHTML = renderJoinRoom();
                    break;
                case 'lobby':
                    main.innerHTML = renderLobby();
                    break;
                case 'game':
                    main.innerHTML = renderGame();
                    if (STATE.room.currentQuestion && STATE.room.currentAction === 'answering') {
                        modal.innerHTML = renderQuestionModal();
                        modal.classList.remove('hidden');
                    } else if (STATE.room.lastAnswerCorrect !== null && STATE.room.currentAction === 'moving') {
                        modal.innerHTML = renderResultModal();
                        modal.classList.remove('hidden');
                    }
                    break;
                case 'game_over':
                    main.innerHTML = renderGameOver();
                    break;
            }

            attachEventListeners();
        }

        function renderMainMenu() {
            return `
                <div class="flex flex-col items-center justify-center h-full p-4 gap-6">
                    <div class="text-center mb-8">
                        <div class="flex justify-center gap-2 mb-4">
                            ${CATEGORIES.map(c => `<div class="w-10 h-10 rounded-full ${c.colorClass} flex items-center justify-center text-xl shadow-lg"><i class="fas ${c.icon}"></i></div>`).join('')}
                        </div>
                        <h2 class="text-4xl text-slate-800 title-font mb-2">Bem-vindo ao</h2>
                        <h1 class="text-6xl text-indigo-600 title-font drop-shadow-md">Perguntados</h1>
                    </div>

                    <div class="w-full max-w-sm space-y-4">

                            <label class="block text-sm font-bold text-gray-700 mb-2">Seu Nome:</label>
                            <input type="text" id="player-name-input" class="w-full p-3 border-2 border-slate-300 rounded-xl focus:border-indigo-500 outline-none text-center text-lg font-bold" placeholder="Digite seu nome" value="${STATE.user.name}">
                        </div>

                        <button id="btn-mode-online" class="w-full py-4 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white rounded-2xl text-xl font-bold shadow-lg transform transition active:scale-95 flex items-center justify-center gap-3">
                            <i class="fas fa-globe"></i> Jogar Online
                        </button>

                        <div class="my-4 relative">
                            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-300"></div></div>
                            <div class="relative flex justify-center text-sm"><span class="px-2 bg-slate-50 text-gray-500">OU</span></div>
                        </div>

                        <button id="btn-mode-offline" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white rounded-2xl text-xl font-bold shadow-lg transform transition active:scale-95 flex items-center justify-center gap-3">
                            <i class="fas fa-users"></i> Jogar Offline
                        </button>
                        <p class="text-xs text-center text-slate-500 mt-1">Pass-and-play em um único dispositivo</p>
                    </div>
                </div>
            `;
        }

        function renderOnlineMenu() {
            return `
                <div class="flex flex-col items-center justify-center h-full p-4 gap-6">
                    <button class="absolute top-4 left-4 text-slate-500 hover:text-slate-800" onclick="STATE.view='menu'; render();">
                        <i class="fas fa-arrow-left text-2xl"></i> Voltar

                    <h2 class="text-3xl title-font text-slate-800 mb-8">Modo Online</h2>

                            Criar Nova Sala
                        </button>
                        <button onclick="STATE.view='join_room'; render();" class="w-full py-4 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl text-xl font-bold shadow-lg transform transition active:scale-95">

                <div class="flex flex-col items-center justify-center h-full p-4">

                        <i class="fas fa-arrow-left text-2xl"></i> Voltar
                    </button>
                    
                    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">
                        <h2 class="text-2xl title-font text-center text-slate-800 mb-6">Configurar Jogo</h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-bold text-gray-700 mb-2">Tamanho do Tabuleiro</label>
                                <select id="board-size" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-indigo-500 bg-slate-50">

                                    <option value="30" selected>30 Casas (Normal)</option>

        function renderJoinRoom() {
            return `
                <div class="flex flex-col items-center justify-center h-full p-4">
                    <button class="absolute top-4 left-4 text-slate-500 hover:text-slate-800" onclick="STATE.view='online_menu'; render();">
                        <i class="fas fa-arrow-left text-2xl"></i> Voltar
                    </button>
                    
                    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center">
                        <h2 class="text-2xl title-font text-slate-800 mb-2">Entrar na Sala</h2>
                        <p class="text-slate-500 mb-6 text-sm">Digite a senha de 4 caracteres fornecida pelo criador.</p>
                        
                        <input type="text" id="room-code-input" maxlength="4" class="w-full p-4 text-center text-4xl font-bold tracking-widest border-2 border-slate-300 rounded-2xl mb-6 uppercase focus:border-indigo-500 outline-none" placeholder="ABCD">

                        </button>
                    </div>
                </div>
            `;
        }

        function renderLobby() {
            const room = STATE.room;
            const isHost = room.hostId === STATE.user.id;
            
            const usedColors = room.players.map(p => p.color).filter(c => c !== null);

            let playersHtml = room.players.map(p => {
                const isMe = p.id === STATE.user.id;
                const hostCrown = p.id === room.hostId ? '<i class="fas fa-crown text-yellow-500 ml-2" title="Criador da Sala"></i>' : '';
                const colorBadge = p.color ? `<div class="w-6 h-6 rounded-full border-2 border-white shadow-sm mr-3 peao-${p.color}"></div>` : `<div class="w-6 h-6 rounded-full border-2 border-dashed border-gray-300 mr-3"></div>`;
                
                return `
                    <div class="flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-100 ${isMe ? 'ring-2 ring-indigo-200' : ''}">
                        <div class="flex items-center">
                            ${colorBadge}
                            <span class="font-bold text-slate-700">${p.name} ${isMe ? '(Você)' : ''} ${hostCrown}</span>
                        </div>
                        ${!p.color ? '<span class="text-xs text-orange-500">Escolhendo cor...</span>' : '<span class="text-xs text-green-500"><i class="fas fa-check"></i> Pronto</span>'}
                    </div>
                `;
            }).join('');

            for(let i = room.players.length; i < room.maxPlayers; i++) {
                playersHtml += `
                    <div class="flex items-center justify-center bg-slate-100/50 p-3 rounded-lg border border-dashed border-slate-300 text-slate-400">
                        <i class="fas fa-spinner fa-spin mr-2"></i> Aguardando jogador...
                    </div>
                `;
            }

            let colorSelectionHtml = '';
            if (STATE.mode === 'online') {
                const myPlayer = room.players.find(p => p.id === STATE.user.id);
                colorSelectionHtml = `
                    <div class="mt-6">
                        <h3 class="text-sm font-bold text-slate-600 mb-2">Escolha seu peão:</h3>
                        <div class="flex flex-wrap gap-2 justify-center">
                            ${PAWN_COLORS.map(c => {
                                const isUsed = usedColors.includes(c.id) && myPlayer?.color !== c.id;
                                const isMine = myPlayer?.color === c.id;
                                return `
                                    <button onclick="selectColor('${c.id}')" ${isUsed ? 'disabled' : ''} 
                                        class="w-10 h-10 rounded-full ${c.class} shadow-md transition-transform 
                                        ${isMine ? 'ring-4 ring-offset-2 ring-indigo-500 transform scale-110' : ''} 
                                        ${isUsed ? 'opacity-30 cursor-not-allowed' : 'hover:scale-110'}">
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                 colorSelectionHtml = `
                    <div class="mt-4 text-center">
                        <p class="text-sm text-slate-500 mb-2">As cores serão atribuídas automaticamente ao iniciar.</p>
                    </div>
                 `;
            }

            const allReady = room.players.length >= 2 && room.players.every(p => p.color !== null) || STATE.mode === 'offline';

            return `
                <div class="flex flex-col h-full">
                    <div class="bg-indigo-50 p-6 shadow-sm border-b flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl title-font text-indigo-900">Sala de Espera</h2>
                            ${STATE.mode === 'online' ? `<p class="text-sm text-indigo-700">Senha: <strong class="text-lg bg-indigo-200 px-2 py-1 rounded select-all">${room.id}</strong></p>` : ''}
                        </div>
                        <button onclick="leaveRoomAction()" class="px-4 py-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 font-bold transition">Sair</button>
                    </div>

                    <div class="flex-1 p-6 overflow-y-auto flex flex-col md:flex-row gap-6">
                        <div class="flex-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Jogadores (${room.players.length}/${room.maxPlayers})</h3>
                            <div class="space-y-2">
                                ${playersHtml}
                            </div>
                            ${colorSelectionHtml}
                        </div>

                        <div class="md:w-1/3 bg-slate-50 p-6 rounded-2xl border border-slate-200 flex flex-col justify-center items-center text-center">
                            <h3 class="text-lg font-bold text-slate-700 mb-2">Regras da Partida</h3>
                            <ul class="text-sm text-slate-600 text-left space-y-2 mb-6">
                                <li><i class="fas fa-check text-green-500 mr-2"></i> Tabuleiro: <strong>${room.boardSize} casas</strong></li>
                                <li><i class="fas fa-check text-green-500 mr-2"></i> Tempo: <strong>60 seg/pergunta</strong></li>
                                <li><i class="fas fa-check text-green-500 mr-2"></i> Vence quem chegar ao fim primeiro!</li>
                            </ul>
                            
                            ${isHost ? `
                                <button onclick="startGame()" ${!allReady ? 'disabled' : ''} 
                                    class="w-full py-4 ${allReady ? 'bg-green-500 hover:bg-green-600' : 'bg-gray-300 cursor-not-allowed'} text-white rounded-xl text-lg font-bold shadow-md transition">
                                    ${allReady ? 'Iniciar Jogo' : 'Aguardando Jogadores...'}
                                </button>
                            ` : `
                                <div class="p-4 bg-yellow-100 text-yellow-800 rounded-xl text-sm font-bold">
                                    Aguardando o líder iniciar a partida...
                                </div>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderGame() {
            const room = STATE.room;
            const currentPlayer = room.players[room.turnIndex];
            const isMyTurn = STATE.mode === 'offline' || currentPlayer.id === STATE.user.id;

            let boardHtml = '';
            for (let i = 1; i <= room.boardSize; i++) {
                const catIndex = (i - 1) % CATEGORIES.length;
                const cat = CATEGORIES[catIndex];
                
                const playersHere = room.players.filter(p => p.position === i);
                let pawnsHtml = '';
                if (playersHere.length > 0) {
                    pawnsHtml = `<div class="absolute inset-0 flex flex-wrap items-center justify-center gap-1 p-1">
                        ${playersHere.map(p => `<div class="w-4 h-4 rounded-full peao-${p.color} border border-white shadow-sm z-10" title="${p.name}"></div>`).join('')}
                    </div>`;
                }

                const isStart = i === 1;
                const isEnd = i === room.boardSize;

                boardHtml += `
                    <div class="relative w-16 h-16 sm:w-20 sm:h-20 flex-shrink-0 flex items-center justify-center rounded-lg shadow-sm border-2 border-white ${cat.colorClass} board-space">
                        <span class="opacity-50 font-bold text-xl">${i}</span>
                        ${isStart ? '<div class="absolute -top-2 -left-2 text-xs bg-black text-white px-1 rounded">INÍCIO</div>' : ''}
                        ${isEnd ? '<div class="absolute -bottom-2 -right-2 text-xs bg-yellow-400 text-black px-1 rounded font-bold"><i class="fas fa-trophy"></i> FIM</div>' : ''}
                        ${pawnsHtml}
                        <div class="absolute bottom-1 right-1 opacity-30 text-xs"><i class="fas ${cat.icon}"></i></div>
                    </div>
                `;
            }

            const scoreboardHtml = room.players.map((p, index) => {
                const isTurn = index === room.turnIndex;
                return `
                    <div class="flex items-center gap-3 p-2 rounded-lg ${isTurn ? 'bg-indigo-100 ring-2 ring-indigo-400' : 'bg-white border'}">
                        <div class="w-8 h-8 rounded-full peao-${p.color} flex items-center justify-center text-white font-bold shadow-inner">
                           ${p.position}
                        </div>
                        <div class="flex-1">
                            <div class="font-bold text-sm text-slate-800 ${isTurn ? 'text-indigo-800' : ''}">${p.name} ${isTurn ? '<span class="text-xs text-indigo-500">(Jogando)</span>' : ''}</div>
                            <div class="text-xs text-slate-500">Pontos: ${p.score}</div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="flex flex-col h-full">
                    <div class="bg-white p-3 shadow-sm border-b flex justify-between items-center shrink-0 z-10">
                        <div class="flex gap-4 overflow-x-auto pb-1 w-full max-w-4xl mx-auto hide-scrollbar">
                            ${scoreboardHtml}
                        </div>
                    </div>

                    <div class="flex-1 p-6 overflow-auto bg-slate-100 flex justify-center items-start">
                        <div class="max-w-4xl w-full">
                            
                            <div class="flex flex-wrap gap-2 justify-center p-4 bg-white/50 rounded-3xl shadow-inner border border-slate-200">
                                <div class="relative w-24 h-24 flex-shrink-0 flex items-center justify-center rounded-full shadow-md bg-slate-200 border-4 border-slate-300">
                                    <span class="font-bold text-slate-500">LARGADA</span>
                                    <div class="absolute inset-0 flex flex-wrap items-center justify-center gap-1 p-2">
                                        ${room.players.filter(p => p.position === 0).map(p => `<div class="w-5 h-5 rounded-full peao-${p.color} border-2 border-white shadow-sm z-10" title="${p.name}"></div>`).join('')}
                                    </div>
                                </div>
                                
                                <div class="w-full flex flex-wrap gap-2 justify-center mt-4">
                                    ${boardHtml}
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="bg-white p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] shrink-0 z-10 flex justify-center items-center min-h-[100px]">
                        ${room.currentAction === 'waiting' && isMyTurn ? `
                            <button onclick="rollDice()" class="px-8 py-4 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white rounded-2xl text-2xl font-bold shadow-xl transform transition hover:scale-105 active:scale-95 flex items-center gap-3">
                                <i class="fas fa-dice"></i> Rolar Dado
                            </button>
                        ` : room.currentAction === 'rolling' ? `
                            <div class="text-center">
                                <i class="fas fa-dice text-6xl text-indigo-500 dice-anim"></i>
                                <p class="mt-2 font-bold text-slate-600">Rolando...</p>
                            </div>
                        ` : room.currentAction === 'answering' ? `
                            <div class="text-center text-slate-600 font-bold animate-pulse">
                                ${isMyTurn ? 'Sua vez de responder!' : `Aguardando ${currentPlayer.name} responder...`}
                            </div>
                        ` : `
                            <div class="text-center text-slate-500">
                                Aguardando a vez de <strong>${currentPlayer.name}</strong>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderQuestionModal() {
            const qData = STATE.room.currentQuestion;
            const cat = qData.category;
            const question = qData.data;
            const currentPlayer = STATE.room.players[STATE.room.turnIndex];
            const isMyTurn = STATE.mode === 'offline' || currentPlayer.id === STATE.user.id;

            let displayTime = STATE.timeLeft;
            if(STATE.mode === 'online') {
                const elapsed = Math.floor((Date.now() - qData.startTime) / 1000);
                displayTime = Math.max(0, 60 - elapsed);
                if(isMyTurn && displayTime === 0 && !STATE.questionWaitTimer) {
                    STATE.questionWaitTimer = setTimeout(() => handleAnswer(-1), 1000);
                }
            }

            const timeColor = displayTime > 20 ? 'text-green-500' : (displayTime > 10 ? 'text-orange-500' : 'text-red-500');

            let content = '';
            if (isMyTurn) {
                content = `
                    <div class="space-y-3 mt-6 w-full">
                        ${question.options.map((opt, idx) => `
                            <button onclick="handleAnswer(${idx})" class="w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-${cat.colorClass.split('-')[1]}-500 hover:bg-slate-50 transition font-bold text-slate-700">
                                ${String.fromCharCode(65 + idx)}. ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else {
                content = `
                    <div class="mt-8 text-center text-slate-500">
                        <i class="fas fa-hourglass-half text-4xl mb-4 opacity-50 animate-pulse"></i>
                        <p>O jogador <strong>${currentPlayer.name}</strong> está pensando...</p>
                        <p class="text-xs mt-2">Você andará ${STATE.room.diceValue} casas se acertar!</p>
                    </div>
                `;
            }

            return `
                <div class="bg-white w-full max-w-lg rounded-3xl overflow-hidden shadow-2xl transform transition-all">
                    <div class="${cat.colorClass} p-6 text-center relative">
                        <div class="absolute top-4 right-4 bg-white/20 px-3 py-1 rounded-full text-sm font-bold flex items-center gap-2">
                            <i class="fas fa-dice"></i> ${STATE.room.diceValue}
                        </div>
                        <i class="fas ${cat.icon} text-4xl mb-2 opacity-80"></i>
                        <h2 class="text-2xl title-font uppercase tracking-wider">${cat.name}</h2>
                    </div>
                    
                    <div class="p-8 flex flex-col items-center">
                        <div class="text-4xl font-black ${timeColor} mb-6 font-mono" id="question-timer">
                            00:${displayTime.toString().padStart(2, '0')}
                        </div>
                        
                        <h3 class="text-xl md:text-2xl font-bold text-center text-slate-800 leading-snug">
                            ${question.q}
                        </h3>
                        
                        ${content}
                    </div>
                </div>
            `;
        }

        function renderResultModal() {
            const isCorrect = STATE.room.lastAnswerCorrect;
            const diceValue = STATE.room.diceValue;
            
            return `
                <div class="bg-white w-full max-w-sm rounded-3xl p-8 text-center shadow-2xl transform transition-all scale-100">
                    ${isCorrect ? `
                        <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fas fa-check text-5xl text-green-500"></i>
                        </div>
                        <h2 class="text-3xl title-font text-slate-800 mb-2">Correto!</h2>
                        <p class="text-slate-600 text-lg">Avançou <strong class="text-indigo-600">${diceValue}</strong> casas.</p>
                    ` : `
                        <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <i class="fas fa-times text-5xl text-red-500"></i>
                        </div>
                        <h2 class="text-3xl title-font text-slate-800 mb-2">Incorreto!</h2>
                        <p class="text-slate-600 text-lg">Continua na mesma casa.</p>
                    `}
                </div>
            `;
        }

        function renderGameOver() {
            const room = STATE.room;
            const playersSorted = [...room.players].sort((a, b) => b.score - a.score || b.position - a.position);
            const winner = playersSorted[0];

            const rankingHtml = playersSorted.map((p, i) => `
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl mb-2 ${i === 0 ? 'ring-2 ring-yellow-400 bg-yellow-50' : ''}">
                    <div class="flex items-center gap-4">
                        <div class="w-8 font-bold text-slate-400 text-xl">${i + 1}º</div>
                        <div class="w-10 h-10 rounded-full peao-${p.color} border-2 border-white shadow"></div>
                        <div class="font-bold text-slate-800 text-lg">${p.name}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-black text-indigo-600">${p.score} pts</div>
                        <div class="text-xs text-slate-500">Casa ${p.position}</div>
                    </div>
                </div>
            `).join('');

            return `
                <div class="flex flex-col items-center justify-center h-full p-4 overflow-y-auto">
                    <div class="text-center mb-8">
                        <i class="fas fa-trophy text-6xl text-yellow-400 drop-shadow-md mb-4"></i>
                        <h1 class="text-4xl title-font text-slate-800">Fim de Jogo!</h1>
                        <p class="text-xl text-slate-600 mt-2"><strong>${winner.name}</strong> venceu a partida!</p>
                    </div>

                    <div class="w-full max-w-lg bg-white p-6 rounded-3xl shadow-xl">
                        <h2 class="text-xl font-bold text-slate-700 mb-4 border-b pb-2">Ranking Final</h2>
                        <div class="mb-6">
                            ${rankingHtml}
                        </div>
                        
                        <button onclick="leaveRoomAction()" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-lg font-bold shadow-md transition">
                            Voltar ao Menu
                        </button>
                    </div>
                </div>
            `;
        }

        function attachEventListeners() {
            const nameInput = document.getElementById('player-name-input');
            if (nameInput) {
                nameInput.addEventListener('change', (e) => {
                    STATE.user.name = e.target.value.trim() || 'Jogador';
                });
            }

            const btnOnline = document.getElementById('btn-mode-online');
            if (btnOnline) {
                btnOnline.onclick = () => {
                    STATE.mode = 'online';
                    STATE.view = 'online_menu';
                    render();
                };
            }

            const btnOffline = document.getElementById('btn-mode-offline');
            if (btnOffline) {
                btnOffline.onclick = () => {
                    STATE.mode = 'offline';
                    STATE.view = 'create_room';
                    render();
                };
            }

            const btnCreate = document.getElementById('btn-create-submit');
            if (btnCreate) {
                btnCreate.onclick = () => {
                    const size = document.getElementById('board-size').value;
                    const maxPlayers = document.getElementById('max-players').value;
                    createRoomAction(size, maxPlayers);
                };

                const maxPlayersSelect = document.getElementById('max-players');
                if (maxPlayersSelect && STATE.mode === 'offline') {
                    const updateOfflineNames = () => {
                        const num = parseInt(maxPlayersSelect.value);
                        const container = document.getElementById('offline-names-container');
                        container.innerHTML = '';
                        for(let i=0; i<num; i++) {
                            const val = i===0 ? STATE.user.name : `Jogador ${i+1}`;
                            container.innerHTML += `<input type="text" id="off-name-${i}" class="w-full p-2 border rounded bg-white text-sm" value="${val}" placeholder="Nome do Jogador ${i+1}">`;
                        }
                    };
                    maxPlayersSelect.addEventListener('change', updateOfflineNames);
                    updateOfflineNames(); 
                }
            }

            const btnJoin = document.getElementById('btn-join-submit');
            if (btnJoin) {
                btnJoin.onclick = () => {
                    const code = document.getElementById('room-code-input').value;
                    if (code.length === 4) {
                        joinRoomAction(code);
                    } else {
                        showToast("A senha deve ter 4 caracteres.", "error");
                    }
                };
            }

            if (STATE.view === 'game' && STATE.room?.currentQuestion && STATE.mode === 'online') {
                const timerEl = document.getElementById('question-timer');
                if(timerEl) {
                    const interval = setInterval(() => {
                        if(STATE.view !== 'game' || !STATE.room?.currentQuestion) {
                            clearInterval(interval);
                            return;
                        }
                        const elapsed = Math.floor((Date.now() - STATE.room.currentQuestion.startTime) / 1000);
                        const left = Math.max(0, 60 - elapsed);
                        timerEl.innerText = `00:${left.toString().padStart(2, '0')}`;
                        if(left <= 10) timerEl.classList.replace('text-green-500', 'text-red-500');
                    }, 1000);
                }
            }
        }

        window.STATE = STATE;
        window.leaveRoomAction = leaveRoomAction;
        window.rollDice = rollDice;
        window.handleAnswer = handleAnswer;
        window.render = render;
        
        window.selectColor = async function(colorId) {
            if (STATE.mode === 'online') {
                const players = [...STATE.room.players];
                const myIndex = players.findIndex(p => p.id === STATE.user.id);
                if (myIndex !== -1) {
                    players[myIndex].color = colorId;
                    await updateRoomState({ players: players });
                }
            }
        };

        window.startGame = async function() {
            if (STATE.mode === 'offline') {
                const num = parseInt(document.getElementById('max-players')?.value || STATE.room.maxPlayers);
                const players = [];
                const availableColors = PAWN_COLORS.map(c => c.id).sort(() => Math.random() - 0.5);
                
                for(let i=0; i<num; i++) {
                    const nameInput = document.getElementById(`off-name-${i}`);
                    players.push({
                        id: `off-${i}`,
                        name: nameInput ? nameInput.value : `Jogador ${i+1}`,
                        color: availableColors[i],
                        position: 0,
                        score: 0
                    });
                }
                STATE.room.players = players;
                STATE.room.maxPlayers = num;
            }

            await updateRoomState({ 
                status: 'playing',
                turnIndex: 0,
                currentAction: 'waiting'
            });
        };

        initApp();

    </script>
</body>
</html>
