<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trilha do Conhecimento - Jogo de Tabuleiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    .glass-modal {
      background: rgba(10, 15, 30, 0.95);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 text-slate-100">

  <!-- CABEÇALHO -->
  <header class="w-full bg-slate-900/90 border-b border-slate-800 px-4 py-3 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center text-white">
          <i class="fa-solid fa-dice-d20 text-xl"></i>
        </div>
        <div>
          <h1 class="font-heading font-extrabold text-xl bg-clip-text text-transparent bg-gradient-to-r from-amber-400 to-sky-400">
            Trilha do Conhecimento
          </h1>
        </div>
      </div>
      <div>
        <button onclick="location.reload()" class="px-3 py-1.5 rounded-lg bg-rose-950/60 hover:bg-rose-900/80 text-rose-300 text-xs font-semibold border border-rose-800/50">
          <i class="fa-solid fa-rotate-left"></i> Reiniciar
        </button>
      </div>
    </div>
  </header>

  <!-- MODAL DE CONFIGURAÇÃO (LOBBY) -->
  <div id="modalSetup" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div class="glass-modal max-w-2xl w-full rounded-3xl p-6 sm:p-8 border border-slate-700 flex flex-col max-h-[90vh] overflow-y-auto">
      
      <div class="text-center mb-5">
        <h2 class="font-heading font-black text-3xl text-white">Configuração da Partida</h2>
        <p class="text-sm text-slate-400 mt-1">Defina os jogadores e as regras do tabuleiro.</p>
      </div>

      <!-- Configuração de Regras pelo Líder -->
      <div class="mb-6 p-4 bg-slate-900/80 border border-slate-700 rounded-xl">
        <label class="block text-xs font-bold uppercase text-amber-400 mb-2">
          <i class="fa-solid fa-crown"></i> Configurações do Líder: Tamanho do Tabuleiro
        </label>
        <select id="boardSizeSelect" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-600 text-white text-sm font-bold focus:border-amber-500 outline-none">
          <option value="20">Partida Rápida (20 Casas)</option>
          <option value="30">Partida Curta (30 Casas)</option>
          <option value="40">Partida Média (40 Casas)</option>
          <option value="50" selected>Partida Clássica (50 Casas)</option>
          <option value="60">Partida Épica (60 Casas)</option>
        </select>
      </div>

      <!-- Quantidade de Jogadores -->
      <div class="mb-4">
        <label class="block text-xs font-bold uppercase text-slate-300 mb-2 text-center">Quantidade de Jogadores</label>
        <div class="flex justify-center gap-2" id="playerCountButtons">
          <!-- Botões gerados via JS -->
        </div>
      </div>

      <!-- Container dos Jogadores -->
      <div id="playerInputsContainer" class="space-y-3 mb-6">
        <!-- Inputs gerados via JS -->
      </div>

      <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-500 to-indigo-600 hover:opacity-90 text-slate-950 font-black text-lg shadow-xl active:scale-95 transition">
        <i class="fa-solid fa-play mr-2"></i> Iniciar Jogo
      </button>

      <!-- Simulação de ambiente Online / Transferência de Liderança -->
      <div class="mt-4 pt-4 border-t border-slate-800 text-center">
        <p class="text-xs text-slate-500 mb-2">Testando modo online? Simule a saída do líder atual:</p>
        <button onclick="simulateLeaderLeave()" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300">
          <i class="fa-solid fa-right-from-bracket"></i> Simular Saída do Líder
        </button>
      </div>

    </div>
  </div>

  <!-- AREA DO JOGO PRINCIPAL -->
  <main class="flex-1 flex flex-col items-center justify-center p-4">
    <div id="gameBoardArea" class="hidden text-center w-full max-w-4xl">
      <h2 class="text-2xl font-black text-amber-400 mb-2">O Tabuleiro está rolando!</h2>
      <p id="boardGoalText" class="text-slate-300 mb-6">Quem chegar na casa X primeiro, vence.</p>
      
      <div class="p-6 bg-slate-900 rounded-2xl border border-slate-700 shadow-xl">
        <div id="activePlayersList" class="flex flex-wrap justify-center gap-4 mb-8">
          <!-- Lista de jogadores no jogo -->
        </div>
        <button onclick="drawRandomQuestion()" class="py-3 px-6 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-clone mr-2"></i> Puxar Carta de Pergunta Aleatória
        </button>
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // 1. BASES DE DADOS (Personagens, Cores, Perguntas)
    // ==========================================
    
    const CHARACTERS = [
      { id: 'tito', name: 'Tito', icon: '🌐' },
      { id: 'albert', name: 'Albert', icon: '🧪' },
      { id: 'hector', name: 'Hector', icon: '🛡️' },
      { id: 'tina', name: 'Tina', icon: '🖌️' },
      { id: 'bonzo', name: 'Bonzo', icon: '🏋️' },
      { id: 'pop', name: 'Pop', icon: '🍿' }
    ];

    const COLOR_OPTIONS = [
      { id: 'cyan', hex: '#00e5ff', name: 'Ciano Neon' },
      { id: 'gold', hex: '#ffcc00', name: 'Ouro Brilhante' },
      { id: 'emerald', hex: '#00e676', name: 'Esmeralda Neon' },
      { id: 'pink', hex: '#ff2a8d', name: 'Rosa Choque' },
      { id: 'violet', hex: '#d500f9', name: 'Violeta Elétrico' },
      { id: 'orange', hex: '#ff7000', name: 'Laranja Solar' }
    ];

    // Banco de Perguntas (Pode adicionar mais seguindo esse padrão)
    let QUESTION_DATABASE = {
      science: [
        { text: 'Qual é a fórmula química da água?', options: ['CO2', 'H2O', 'NaCl', 'O2'], correct: 1 },
        { text: 'Qual órgão humano bombeia o sangue?', options: ['Fígado', 'Pulmão', 'Coração', 'Rim'], correct: 2 },
        { text: 'Qual é o planeta mais próximo do Sol?', options: ['Terra', 'Marte', 'Vênus', 'Mercúrio'], correct: 3 }
      ],
      geo: [
        { text: 'Qual é o maior país do mundo em extensão?', options: ['Canadá', 'China', 'Rússia', 'EUA'], correct: 2 },
        { text: 'Qual a capital do Japão?', options: ['Seul', 'Tóquio', 'Pequim', 'Bangkok'], correct: 1 },
        { text: 'Em qual continente fica o Egito?', options: ['Ásia', 'África', 'Europa', 'América'], correct: 1 }
      ],
      history: [
        { text: 'Quem descobriu o Brasil em 1500?', options: ['Cristóvão Colombo', 'Pedro Álvares Cabral', 'Vasco da Gama', 'Dom Pedro I'], correct: 1 },
        { text: 'Em que ano começou a Segunda Guerra Mundial?', options: ['1914', '1939', '1945', '1929'], correct: 1 }
      ]
    };

    // ==========================================
    // 2. VARIÁVEIS DE ESTADO DA PARTIDA
    // ==========================================
    
    let numPlayers = 2;
    let targetSpaces = 50; // Definido pelo líder
    let playersState = []; // Array que guardará quem está jogando
    let currentLeaderId = 1; // Controla quem é o dono da sala

    // ==========================================
    // 3. LÓGICA DE EMBARALHAMENTO (SHUFFLE)
    // ==========================================
    
    // Mistura as perguntas para nunca caírem na mesma ordem
    function shuffleDecks() {
      for (let category in QUESTION_DATABASE) {
        QUESTION_DATABASE[category] = QUESTION_DATABASE[category].sort(() => Math.random() - 0.5);
      }
      console.log("Cartas embaralhadas com sucesso!");
    }

    // ==========================================
    // 4. LÓGICA DA INTERFACE DE CONFIGURAÇÃO (LOBBY)
    // ==========================================

    function setPlayerCount(count) {
      numPlayers = count;
      const btnContainer = document.getElementById('playerCountButtons');
      btnContainer.innerHTML = '';
      
      for(let i = 2; i <= 6; i++) {
        const isSelected = i === count;
        const btnClass = isSelected 
          ? 'px-4 py-2 rounded-xl bg-indigo-600 text-white font-black text-sm shadow' 
          : 'px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-black text-sm border border-slate-700';
        
        btnContainer.innerHTML += `<button onclick="setPlayerCount(${i})" class="${btnClass}">${i}</button>`;
      }
      renderPlayerInputs();
    }

    function renderPlayerInputs() {
      const container = document.getElementById('playerInputsContainer');
      container.innerHTML = ''; 

      const colorOptionsHTML = COLOR_OPTIONS.map(c => `<option value="${c.hex}">${c.name}</option>`).join('');
      const charOptionsHTML = CHARACTERS.map(c => `<option value="${c.name}">${c.icon} ${c.name}</option>`).join('');

      for (let i = 1; i <= numPlayers; i++) {
        const isLeader = i === currentLeaderId;
        const leaderBadge = isLeader ? `<span class="ml-2 text-[9px] bg-amber-500 text-black px-1.5 py-0.5 rounded-sm"><i class="fa-solid fa-crown"></i> LÍDER</span>` : '';

        container.innerHTML += `
          <div class="p-3 rounded-xl ${isLeader ? 'bg-indigo-900/40 border-indigo-500/50' : 'bg-slate-900/80 border-slate-700'} border flex flex-col sm:flex-row gap-3 relative" id="playerRow_${i}">
            <div class="flex-1">
              <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1 flex items-center">
                Jogador ${i} ${leaderBadge}
              </label>
              <input type="text" id="p${i}_name" value="Jogador ${i}" maxlength="12" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs font-bold focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex-1">
              <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Cor</label>
              <select id="p${i}_color" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs font-bold">
                ${colorOptionsHTML}
              </select>
            </div>
            <div class="flex-1">
              <label class="block text-[10px] uppercase font-bold text-slate-400 mb-1">Personagem</label>
              <select id="p${i}_char" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-white text-xs font-bold">
                ${charOptionsHTML}
              </select>
            </div>
          </div>
        `;
      }
    }

    // ==========================================
    // 5. INICIAR O JOGO E TRANSIÇÃO DE LÍDER
    // ==========================================

    function startGame() {
      // 1. Define o tamanho do tabuleiro escolhido pelo líder
      targetSpaces = parseInt(document.getElementById('boardSizeSelect').value);
      
      // 2. Salva os dados dos jogadores
      playersState = [];
      for (let i = 1; i <= numPlayers; i++) {
        // Verifica se a linha existe (pode ter sido removida numa simulação de saída)
        if(document.getElementById(`playerRow_${i}`)) {
          playersState.push({ 
            id: i, 
            name: document.getElementById(`p${i}_name`).value, 
            color: document.getElementById(`p${i}_color`).value, 
            char: document.getElementById(`p${i}_char`).value, 
            isHost: (i === currentLeaderId),
            position: 0 
          });
        }
      }

      // 3. Mistura as perguntas para a nova partida
      shuffleDecks();

      // 4. Esconde configuração, mostra tabuleiro
      document.getElementById('modalSetup').classList.add('hidden');
      document.getElementById('gameBoardArea').classList.remove('hidden');
      document.getElementById('boardGoalText').innerText = `O primeiro a chegar na casa ${targetSpaces} vence!`;
      
      updateBoardUI();
    }

    // Atualiza visualmente quem está no jogo
    function updateBoardUI() {
      const list = document.getElementById('activePlayersList');
      list.innerHTML = '';
      playersState.forEach(p => {
        list.innerHTML += `
          <div class="flex flex-col items-center p-3 bg-slate-800 rounded-xl border-2" style="border-color: ${p.color}">
            <span class="text-3xl mb-1">${p.char.split(' ')[0]}</span>
            <span class="text-xs font-bold">${p.name} ${p.isHost ? '👑' : ''}</span>
            <span class="text-xs text-slate-400">Casa: ${p.position}</span>
          </div>
        `;
      });
    }

    // Simulador de Migração de Host (Líder sai da sala)
    function simulateLeaderLeave() {
      if(numPlayers <= 1) return alert("Não há jogadores suficientes para passar a liderança.");
      
      alert(`O líder (Jogador ${currentLeaderId}) desconectou da sala!`);
      
      // Remove o líder atual do HTML
      const leaderRow = document.getElementById(`playerRow_${currentLeaderId}`);
      if(leaderRow) leaderRow.remove();
      
      // Acha o próximo jogador disponível para ser líder
      for(let i = 1; i <= 6; i++) {
        if(i !== currentLeaderId && document.getElementById(`playerRow_${i}`)) {
          currentLeaderId = i;
          alert(`Liderança transferida! Jogador ${i} agora é o líder da sala.`);
          renderPlayerInputs(); // Re-renderiza para mostrar a coroa no novo líder
          break;
        }
      }
    }

    // ==========================================
    // 6. PUXAR PERGUNTAS (SEM REPETIR)
    // ==========================================
    
    function drawRandomQuestion() {
      // Escolhe uma categoria aleatória
      const categories = Object.keys(QUESTION_DATABASE);
      const randomCat = categories[Math.floor(Math.random() * categories.length)];
      const deck = QUESTION_DATABASE[randomCat];

      if (deck.length === 0) {
        alert("Acabaram as perguntas dessa categoria! Puxe novamente.");
        return;
      }

      // Tira a primeira pergunta do deck (como já estão embaralhadas, é aleatório e não repete)
      const question = deck.pop(); 
      
      // Mostra a pergunta na tela
      alert(`CATEGORIA: ${randomCat.toUpperCase()}\n\nPERGUNTA: ${question.text}\n\nRestam ${deck.length} cartas neste monte.`);
    }

    // INICIALIZAÇÃO AUTOMÁTICA
    window.onload = () => {
      setPlayerCount(2); // Inicia com 2 jogadores por padrão
    };

  </script>
</body>
</html>
