<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trilha do Conhecimento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="h-full flex flex-col font-sans bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 text-slate-100">

  <!-- CABEÇALHO -->
  <header class="w-full bg-slate-900/90 border-b border-slate-800 px-4 py-3 sticky top-0 z-30 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center text-white">
          <i class="fa-solid fa-dice-d20 text-xl"></i>
        </div>
        <h1 class="font-heading font-extrabold text-xl bg-clip-text text-transparent bg-gradient-to-r from-amber-400 to-sky-400">
          Trilha do Conhecimento
        </h1>
      </div>
      <button onclick="location.reload()" class="px-3 py-1.5 rounded-lg bg-rose-950 hover:bg-rose-900 text-rose-300 text-xs font-semibold border border-rose-800 transition">
        Reiniciar
      </button>
    </div>
  </header>

  <!-- LOBBY -->
  <div id="modalSetup" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
    <div class="bg-slate-900 max-w-2xl w-full rounded-3xl p-6 border border-slate-700 flex flex-col max-h-[90vh] overflow-y-auto shadow-2xl">
      
      <div class="text-center mb-5">
        <h2 class="font-heading font-black text-3xl text-white">Configuração</h2>
      </div>

      <!-- Tamanho Tabuleiro -->
      <div class="mb-6 p-4 bg-slate-800 rounded-xl border border-slate-600">
        <label class="block text-xs font-bold uppercase text-amber-400 mb-2">Tamanho do Tabuleiro</label>
        <select id="boardSizeSelect" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-600 text-white text-sm font-bold">
          <option value="20">20 Casas</option>
          <option value="30">30 Casas</option>
          <option value="40">40 Casas</option>
          <option value="50" selected>50 Casas</option>
          <option value="60">60 Casas</option>
        </select>
      </div>

      <!-- Jogadores -->
      <div class="mb-4">
        <label class="block text-xs font-bold uppercase text-slate-300 mb-2 text-center">Quantidade de Jogadores</label>
        <div class="flex justify-center gap-2" id="playerCountButtons"></div>
      </div>

      <div id="playerInputsContainer" class="space-y-3 mb-6"></div>

      <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg transition">
        Iniciar Jogo
      </button>

      <div class="mt-4 pt-4 border-t border-slate-800 text-center">
        <button onclick="simulateLeaderLeave()" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300">
          Simular Saída do Líder
        </button>
      </div>
    </div>
  </div>

  <!-- TABULEIRO -->
  <main class="flex-1 flex flex-col items-center justify-center p-4">
    <div id="gameBoardArea" class="hidden text-center w-full max-w-4xl">
      <h2 class="text-3xl font-black text-amber-400 mb-2">O Jogo Começou!</h2>
      <p id="boardGoalText" class="text-slate-300 mb-8 font-semibold"></p>
      
      <div class="p-6 bg-slate-900 rounded-2xl border border-slate-700">
        <div id="activePlayersList" class="flex flex-wrap justify-center gap-6 mb-8"></div>
        
        <button onclick="drawRandomQuestion()" class="py-4 px-8 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-lg">
          Puxar Carta de Pergunta
        </button>
      </div>
    </div>
  </main>

  <script>
    const CHARACTERS = [
      { id: 'tito', name: 'Tito', icon: '🌐' },
      { id: 'albert', name: 'Albert', icon: '🧪' },
      { id: 'hector', name: 'Hector', icon: '🛡️' },
      { id: 'tina', name: 'Tina', icon: '🖌️' },
      { id: 'bonzo', name: 'Bonzo', icon: '🏋️' },
      { id: 'pop', name: 'Pop', icon: '🍿' }
    ];

    const COLOR_OPTIONS = [
      { hex: '#00e5ff', name: 'Ciano' },
      { hex: '#ffcc00', name: 'Ouro' },
      { hex: '#00e676', name: 'Verde' },
      { hex: '#ff2a8d', name: 'Rosa' },
      { hex: '#d500f9', name: 'Roxo' },
      { hex: '#ff7000', name: 'Laranja' }
    ];

    let QUESTION_DATABASE = {
      science: [{ text: 'Fórmula da água?', correct: 1 }, { text: 'Planeta mais próximo do sol?', correct: 3 }],
      geo: [{ text: 'Capital do Japão?', correct: 1 }, { text: 'Onde fica o Egito?', correct: 1 }]
    };

    let numPlayers = 2;
    let targetSpaces = 50; 
    let playersState = []; 
    let currentLeaderId = 1; 

    function setPlayerCount(count) {
      numPlayers = count;
      let btnsHTML = '';
      for(let i = 2; i <= 6; i++) {
        let isSelected = (i === count);
        let btnClass = isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300';
        btnsHTML += `<button onclick="setPlayerCount(${i})" class="px-4 py-2 rounded-xl font-black text-sm ${btnClass}">${i}</button>`;
      }
      document.getElementById('playerCountButtons').innerHTML = btnsHTML;
      renderPlayerInputs();
    }

    function renderPlayerInputs() {
      let html = '';
      let colorHTML = COLOR_OPTIONS.map(c => `<option value="${c.hex}">${c.name}</option>`).join('');
      let charHTML = CHARACTERS.map(c => `<option value="${c.icon}|${c.name}">${c.icon} ${c.name}</option>`).join('');

      for (let i = 1; i <= numPlayers; i++) {
        let isLeader = (i === currentLeaderId);
        html += `
          <div id="playerRow_${i}" class="p-3 rounded-xl ${isLeader ? 'bg-indigo-900/40' : 'bg-slate-800'} flex flex-col sm:flex-row gap-3">
            <div class="flex-1">
              <label class="block text-[10px] text-slate-400">Jogador ${i} ${isLeader ? '(Líder)' : ''}</label>
              <input type="text" id="p${i}_name" value="Jogador ${i}" class="w-full px-2 py-1 bg-slate-950 text-white rounded">
            </div>
            <div class="flex-1">
              <label class="block text-[10px] text-slate-400">Cor</label>
              <select id="p${i}_color" class="w-full px-2 py-1 bg-slate-950 text-white rounded">${colorHTML}</select>
            </div>
            <div class="flex-1">
              <label class="block text-[10px] text-slate-400">Personagem</label>
              <select id="p${i}_char" class="w-full px-2 py-1 bg-slate-950 text-white rounded">${charHTML}</select>
            </div>
          </div>
        `;
      }
      document.getElementById('playerInputsContainer').innerHTML = html;
    }

    function startGame() {
      targetSpaces = parseInt(document.getElementById('boardSizeSelect').value);
      playersState = [];
      
      for (let i = 1; i <= numPlayers; i++) {
        if(document.getElementById(`playerRow_${i}`)) {
          let charData = document.getElementById(`p${i}_char`).value.split('|'); 
          playersState.push({ 
            id: i, 
            name: document.getElementById(`p${i}_name`).value, 
            color: document.getElementById(`p${i}_color`).value, 
            charIcon: charData[0],
            charName: charData[1],
            isHost: (i === currentLeaderId),
            position: 0 
          });
        }
      }

      document.getElementById('modalSetup').classList.add('hidden');
      document.getElementById('gameBoardArea').classList.remove('hidden');
      document.getElementById('boardGoalText').innerText = `Chegue na casa ${targetSpaces} para vencer!`;
      
      updateBoardUI();
    }

    function updateBoardUI() {
      let html = '';
      playersState.forEach(p => {
        html += `
          <div class="p-4 bg-slate-950 rounded-xl border-4 text-center min-w-[120px]" style="border-color: ${p.color};">
            <div class="text-4xl mb-2">${p.charIcon}</div>
            <div class="font-bold text-white">${p.name}</div>
            <div class="text-xs text-slate-400 mt-1">Casa ${p.position}</div>
          </div>
        `;
      });
      document.getElementById('activePlayersList').innerHTML = html;
    }

    function simulateLeaderLeave() {
      const leaderRow = document.getElementById(`playerRow_${currentLeaderId}`);
      if(leaderRow) leaderRow.remove();
      
      for(let i = 1; i <= 6; i++) {
        if(i !== currentLeaderId && document.getElementById(`playerRow_${i}`)) {
          currentLeaderId = i;
          renderPlayerInputs(); 
          break;
        }
      }
    }

    function drawRandomQuestion() {
      const cats = Object.keys(QUESTION_DATABASE);
      const cat = cats[Math.floor(Math.random() * cats.length)];
      const deck = QUESTION_DATABASE[cat];
      
      if(deck.length === 0) return alert("Perguntas esgotadas!");
      
      // Remove a pergunta para não repetir
      const q = deck.splice(Math.floor(Math.random() * deck.length), 1)[0];
      alert(`CATEGORIA: ${cat.toUpperCase()}\n\nPERGUNTA: ${q.text}`);
    }

    window.onload = () => {
      setPlayerCount(2); 
    };
  </script>
</body>
</html>
